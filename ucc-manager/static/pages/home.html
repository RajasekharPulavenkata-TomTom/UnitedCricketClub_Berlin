<!-- Top stat cards -->
<div class="row g-3 mb-4">
  <div class="col-6 col-xl-3">
    <a href="#members" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          🏏 Players
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-total-members">—</div>
        <div class="text-muted small" id="home-active-members"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#equipment" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          🎽 Kit
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-total-equipment">—</div>
        <div class="text-muted small" id="home-available-equipment"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#dashboard" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-cash-coin"></i> Balance
        </div>
        <div class="fs-2 fw-bold" id="home-balance">—</div>
        <div class="text-muted small" id="home-balance-sub"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#tasks" class="text-decoration-none">
      <div class="card stat-card stat-count h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-check2-square"></i> Open Tasks
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-open-tasks">—</div>
        <div class="text-muted small" id="home-tasks-sub"></div>
      </div>
    </a>
  </div>
</div>

<!-- Upcoming Events -->
<div class="card mb-4">
  <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
    <span>🏏 Upcoming Events</span>
    <a href="#calendar" class="btn btn-sm btn-outline-success">Calendar</a>
  </div>
  <div class="card-body p-0" id="home-events">
    <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
  </div>
</div>

<div class="row g-3">
  <!-- Member breakdown -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold">
        👕 Squad
      </div>
      <div class="card-body" id="home-member-breakdown">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>

  <!-- Equipment summary -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold">
        🎽 Kit & Equipment
      </div>
      <div class="card-body" id="home-equipment-breakdown">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>

  <!-- Recent transactions -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
        <span>💰 Recent Transactions</span>
        <a href="#transactions" class="btn btn-sm btn-outline-success">View All</a>
      </div>
      <div class="card-body p-0" id="home-recent-tx">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>

  <!-- Open tasks -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
        <span>📋 Open Tasks</span>
        <a href="#tasks" class="btn btn-sm btn-outline-success">View All</a>
      </div>
      <div class="card-body p-0" id="home-tasks-list">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>
</div>
