<h3 class="page-header"><i class="bi bi-trophy me-2"></i>Tournament Fees</h3>

<!-- Tournaments list -->
<div class="card mb-4">
  <div class="card-header bg-white d-flex justify-content-between align-items-center">
    <span><i class="bi bi-list-ul me-2"></i>Tournaments</span>
    <button class="btn btn-success btn-sm" id="btn-new-tournament">
      <i class="bi bi-plus-lg me-1"></i>New Tournament
    </button>
  </div>
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Total Fee</th>
          <th>Players</th>
          <th>Total Matches</th>
          <th>Fee / Match</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tournament-tbody">
        <tr><td colspan="6" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Detail panel -->
<div id="tournament-detail" style="display:none">
  <div class="card mb-3">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <span class="fw-semibold" id="detail-title"></span>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" id="btn-edit-tournament">
          <i class="bi bi-pencil me-1"></i>Edit
        </button>
        <button class="btn btn-sm btn-outline-secondary" id="btn-close-detail">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
    <div class="card-body">
      <!-- Add player row -->
      <div class="row g-2 align-items-end mb-3">
        <div class="col-md-5">
          <label class="form-label small text-muted mb-1">Player</label>
          <select id="add-member-select" class="form-select form-select-sm">
            <option value="">— Select player —</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label small text-muted mb-1">Matches played</label>
          <input type="number" id="add-matches-input" class="form-control form-control-sm" min="1" value="1" />
        </div>
        <div class="col-md-2">
          <button class="btn btn-success btn-sm w-100" id="btn-add-participant">
            <i class="bi bi-plus-lg me-1"></i>Add
          </button>
        </div>
      </div>

      <!-- Participants table -->
      <table class="table table-sm mb-2">
        <thead class="table-light">
          <tr>
            <th>Player</th>
            <th class="text-center">Matches Played</th>
            <th class="text-end">Fee Share</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="participants-tbody">
          <tr><td colspan="4" class="text-muted text-center py-3">No players added yet.</td></tr>
        </tbody>
        <tfoot id="participants-tfoot" style="display:none">
          <tr class="table-light fw-semibold">
            <td>Total</td>
            <td class="text-center" id="total-matches"></td>
            <td class="text-end" id="total-fee-display"></td>
            <td></td>
          </tr>
          <tr class="table-light text-muted small">
            <td colspan="4" id="fee-per-match-label"></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>
</div>

<!-- Tournament Modal (new / edit) -->
<div class="modal fade" id="tournamentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tournament-modal-title">New Tournament</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="tournament-form">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Tournament Name</label>
            <input type="text" id="t-name" class="form-control" placeholder="e.g. Berlin Summer Cup 2025" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Total Fee (€)</label>
            <input type="number" id="t-fee" class="form-control" min="0" step="0.01" placeholder="0.00" required />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success" id="t-save-btn">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit matches modal -->
<div class="modal fade" id="editMatchesModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Matches Played</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="edit-matches-form">
        <div class="modal-body">
          <label class="form-label">Matches played</label>
          <input type="number" id="edit-matches-input" class="form-control" min="1" required />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
