<h3 class="page-header"><i class="bi bi-exclamation-circle me-2"></i>Pain Points</h3>

<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2 no-print">
  <div class="d-flex gap-2 flex-wrap" id="pp-summary"></div>
  <button class="btn btn-success btn-sm" data-bs-toggle="modal" data-bs-target="#raisePPModal">
    <i class="bi bi-plus-lg me-1"></i>Raise a Pain Point
  </button>
</div>

<div class="d-flex align-items-center gap-2 flex-wrap mb-4 no-print" id="pp-filters">
  <button class="btn btn-sm btn-success active" data-filter="">All</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="open">Open</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="discussed">Discussed</button>
  <button class="btn btn-sm btn-outline-secondary" data-filter="resolved">Resolved</button>
  <select class="form-select form-select-sm ms-auto" id="pp-category-filter" style="width:auto;min-width:160px">
    <option value="">All categories</option>
    <option value="gameplay">Gameplay</option>
    <option value="facilities">Facilities</option>
    <option value="communication">Communication</option>
    <option value="scheduling">Scheduling</option>
    <option value="equipment">Equipment</option>
    <option value="other">Other</option>
  </select>
</div>

<div id="pp-container"></div>

<!-- Raise a Pain Point Modal -->
<div class="modal fade" id="raisePPModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-exclamation-circle me-2"></i>Raise a Pain Point</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="pp-raise-form" autocomplete="off">
          <div class="mb-3">
            <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="pp-title" placeholder="Brief description of the issue" maxlength="200" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Category</label>
            <select class="form-select" id="pp-category">
              <option value="">— Select a category —</option>
              <option value="gameplay">Gameplay</option>
              <option value="facilities">Facilities</option>
              <option value="communication">Communication</option>
              <option value="scheduling">Scheduling</option>
              <option value="equipment">Equipment</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description <span class="text-muted fw-normal small">(optional)</span></label>
            <textarea class="form-control" id="pp-description" rows="3" placeholder="Provide more details…"></textarea>
          </div>
          <div class="alert alert-info py-2 small mb-2">
            <i class="bi bi-shield-check me-1"></i>Submissions are always anonymous. Admins can see who submitted.
          </div>
          <div id="raise-pp-error" class="alert alert-danger py-2 small d-none mt-2 mb-0"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="window._ppSubmit()">
          <i class="bi bi-send me-1"></i>Submit
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Admin: Update Status Modal -->
<div class="modal fade" id="editPPModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Update Pain Point</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Status</label>
          <select class="form-select" id="pp-edit-status">
            <option value="open">Open</option>
            <option value="discussed">Discussed</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold">Admin Note <span class="text-muted fw-normal small">(optional)</span></label>
          <textarea class="form-control" id="pp-edit-resolution" rows="3" placeholder="Add context, discussion notes, or resolution details…"></textarea>
        </div>
        <div id="edit-pp-error" class="alert alert-danger py-2 small d-none mt-2 mb-0"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success" onclick="window._ppUpdate()">
          <i class="bi bi-check-lg me-1"></i>Update
        </button>
      </div>
    </div>
  </div>
</div>

<style>
.pp-card { border-radius: 10px; transition: box-shadow .15s; }
.pp-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.09); }
</style>
