<h3 class="page-header"><i class="bi bi-calendar3 me-2"></i>Calendar</h3>

<div class="d-flex align-items-center justify-content-between mb-3 no-print">
  <div class="d-flex align-items-center gap-2">
    <button class="btn btn-outline-secondary btn-sm" id="cal-prev"><i class="bi bi-chevron-left"></i></button>
    <h5 class="mb-0 fw-semibold" id="cal-title" style="min-width:180px;text-align:center"></h5>
    <button class="btn btn-outline-secondary btn-sm" id="cal-next"><i class="bi bi-chevron-right"></i></button>
    <button class="btn btn-outline-secondary btn-sm ms-2" id="cal-today">Today</button>
  </div>
  <div class="d-flex gap-2">
    <a href="/docs/DCB-Spielberichtsbogen_Eng.pdf" download class="btn btn-outline-danger btn-sm" title="Download DCB Match Report Sheet">
      <i class="bi bi-file-earmark-pdf me-1"></i>Match Sheet
    </a>
    <button class="btn btn-outline-secondary btn-sm" id="btn-share-avail" title="Copy player availability link">
      <i class="bi bi-share me-1"></i>Player Link
    </button>
    <button class="btn btn-success btn-sm" id="btn-add-event">
      <i class="bi bi-plus-lg me-1"></i>Add Event
    </button>
  </div>
</div>

<div class="d-flex gap-3 mb-3 small text-muted">
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#198754;margin-right:4px"></span>Available</span>
  <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#dc3545;margin-right:4px"></span>Unavailable</span>
  <span class="ms-2 fst-italic">Click any date to mark availability</span>
</div>

<!-- Calendar Grid -->
<div class="card mb-4">
  <div class="card-body p-2">
    <div id="cal-grid"></div>
  </div>
</div>

<!-- Add/Edit Event Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eventModalTitle">Add Event</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="event-form">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" name="title" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" name="date" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Type</label>
              <select class="form-select" name="type">
                <option value="match">Match</option>
                <option value="training">Training</option>
                <option value="other" selected>Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Location</label>
              <input type="text" class="form-control" name="location" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Reporting Time <span class="text-muted small fw-normal">(optional)</span></label>
              <input type="time" class="form-control" name="reporting_time" />
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Event Detail / Availability Modal -->
<div class="modal fade" id="eventDetailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title mb-0" id="det-title"></h5>
          <small class="text-muted" id="det-meta"></small>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex gap-2 mb-3 no-print">
          <button class="btn btn-sm btn-outline-secondary" id="det-edit-btn"><i class="bi bi-pencil me-1"></i>Edit</button>
          <button class="btn btn-sm btn-outline-danger" id="det-delete-btn"><i class="bi bi-trash me-1"></i>Delete</button>
        </div>
        <div id="det-reporting-time" class="mb-2" style="display:none">
          <span class="badge text-bg-warning fs-6 px-3 py-2">
            <i class="bi bi-clock-fill me-1"></i>
            Report by <span id="det-report-time-val"></span>
          </span>
        </div>
        <div id="det-weather"></div>
        <div class="row g-2 mb-3" id="det-counts"></div>
        <div class="d-flex align-items-center justify-content-between mb-2">
          <h6 class="fw-semibold mb-0">Player Availability</h6>
          <div class="d-flex gap-2 no-print">
            <button class="btn btn-sm btn-outline-success" onclick="window._bulkSetAvail('available')">
              <i class="bi bi-check-circle me-1"></i>All Available
            </button>
            <button class="btn btn-sm btn-outline-secondary" onclick="window._bulkResetAvail()">
              <i class="bi bi-dash-circle me-1"></i>Reset All
            </button>
          </div>
        </div>
        <div id="det-avail-list"></div>

      </div>
    </div>
  </div>
</div>

<!-- Player Availability Dialog (native dialog, no Bootstrap) -->
<dialog id="av-dialog" style="border:none;border-radius:12px;padding:0;max-width:480px;width:95%;box-shadow:0 8px 32px rgba(0,0,0,0.18)">
  <div style="background:var(--ucc-blue);color:#fff;padding:14px 20px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between">
    <h5 class="mb-0 fw-semibold" id="av-dialog-title"></h5>
    <button id="av-dialog-close" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;line-height:1">&times;</button>
  </div>
  <div style="padding:0">
    <div id="av-entry-list"></div>
    <div style="padding:14px 16px;border-top:1px solid #e9ecef">
      <div class="row g-2 align-items-end">
        <div class="col">
          <label class="form-label small fw-semibold mb-1">Player</label>
          <select class="form-select form-select-sm" id="av-player-select"></select>
        </div>
        <div class="col-auto">
          <label class="form-label small fw-semibold mb-1 d-block">Mark as</label>
          <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" id="av-btn-available">
              <i class="bi bi-check-circle me-1"></i>Available
            </button>
            <button class="btn btn-danger btn-sm" id="av-btn-unavailable">
              <i class="bi bi-x-circle me-1"></i>Unavailable
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="padding:10px 16px;border-top:1px solid #e9ecef;text-align:right">
    <button class="btn btn-secondary btn-sm" id="av-dialog-done">Done</button>
  </div>
</dialog>
