<!-- Internal Tournaments -->
<div class="container-fluid py-3">

  <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
    <h4 class="mb-0">🏏 Internal Tournaments</h4>
    <button class="btn btn-success btn-sm" id="btn-new-int-tournament">
      <i class="bi bi-plus-lg me-1"></i>New Tournament
    </button>
  </div>

  <!-- Tournament list -->
  <div class="card mb-4">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Dates</th>
            <th>Format</th>
            <th>Venue</th>
            <th>Teams</th>
            <th>Status</th>
            <th>Champion</th>
          </tr>
        </thead>
        <tbody id="int-tournament-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- Detail panel -->
  <div id="int-tournament-detail" class="card" style="display:none">
    <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
      <span class="fw-semibold fs-5" id="int-detail-title"></span>
      <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-sm btn-outline-secondary" id="btn-edit-int-tournament">
          <i class="bi bi-pencil me-1"></i>Edit
        </button>
        <button class="btn btn-sm btn-outline-danger d-none" id="btn-delete-int-tournament">
          <i class="bi bi-trash me-1"></i>Delete
        </button>
        <button class="btn btn-sm btn-outline-secondary" id="btn-close-int-detail">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
    </div>
    <div class="card-body">

      <!-- Meta row -->
      <div class="row g-3 mb-3" id="int-detail-meta"></div>

      <!-- Status control -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Status</label>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-sm int-status-btn" data-status="upcoming">Upcoming</button>
          <button class="btn btn-sm int-status-btn" data-status="ongoing">Ongoing</button>
          <button class="btn btn-sm int-status-btn" data-status="completed">Completed</button>
        </div>
      </div>

      <!-- Champion field -->
      <div class="mb-4" id="int-champion-row" style="display:none">
        <label class="form-label fw-semibold">🏆 Champion</label>
        <div class="input-group" style="max-width:400px">
          <input type="text" class="form-control" id="int-champion-input" placeholder="Winning team name…" maxlength="100">
          <button class="btn btn-outline-primary" id="btn-save-champion">Save</button>
        </div>
      </div>

      <!-- Add team -->
      <div class="d-flex align-items-center justify-content-between mb-2 flex-wrap gap-2">
        <h6 class="fw-semibold mb-0">Teams</h6>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" id="int-team-name-input"
            placeholder="Team name…" maxlength="100" style="width:180px">
          <button class="btn btn-sm btn-outline-success" id="btn-int-add-team">
            <i class="bi bi-plus-lg me-1"></i>Add Team
          </button>
        </div>
      </div>

      <!-- Teams accordion -->
      <div id="int-teams-container"></div>
    </div>
  </div>
</div>

<!-- Member select modal for adding to team -->
<div class="modal fade" id="intAddPlayerModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">Add Player to <span id="int-team-modal-name"></span></h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <select class="form-select" id="int-add-player-select"></select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-success btn-sm" id="btn-int-confirm-add-player">Add</button>
      </div>
    </div>
  </div>
</div>

<!-- Create / Edit Modal -->
<div class="modal fade" id="intTournamentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="int-modal-title">New Tournament</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="int-tournament-form">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Tournament Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="name" required maxlength="150">
            </div>
            <div class="col-md-6">
              <label class="form-label">Format</label>
              <select class="form-select" name="format">
                <option value="">— Select —</option>
                <option>T20</option>
                <option>T10</option>
                <option>ODI</option>
                <option>8 Overs</option>
                <option>6 Overs</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Venue</label>
              <input type="text" class="form-control" name="venue" maxlength="150">
            </div>
            <div class="col-md-6">
              <label class="form-label">Start Date <span class="text-danger">*</span></label>
              <input type="date" class="form-control" name="start_date" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">End Date</label>
              <input type="date" class="form-control" name="end_date">
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="2" maxlength="1000"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success" id="int-save-btn">Save Tournament</button>
        </div>
      </form>
    </div>
  </div>
</div>
