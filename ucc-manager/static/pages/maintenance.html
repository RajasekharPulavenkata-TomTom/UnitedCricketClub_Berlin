<h3 class="page-header"><i class="bi bi-tools me-2"></i>Maintenance Log</h3>

<div class="card mb-3 no-print">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-md-5">
        <label class="form-label mb-1">Equipment</label>
        <select id="eq-filter" class="form-select form-select-sm">
          <option value="">All Equipment</option>
        </select>
      </div>
      <div class="col-auto ms-auto">
        <button class="btn btn-success btn-sm" id="btn-add-note">
          <i class="bi bi-plus-lg me-1"></i>Add Maintenance Note
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>Date</th><th>Equipment</th><th>Description</th><th class="text-end">Cost</th><th>Done By</th><th class="no-print"></th></tr>
        </thead>
        <tbody id="maint-tbody">
          <tr><td colspan="6" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="maintModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="maintModalTitle">Add Maintenance Note</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="maint-form">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Equipment</label>
            <select class="form-select" name="equipment_id" id="maint-eq-select" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="3" required></textarea>
          </div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">Cost (€)</label>
              <input type="number" class="form-control" name="cost" step="0.01" min="0" />
            </div>
            <div class="col-6">
              <label class="form-label">Done By</label>
              <input type="text" class="form-control" name="done_by" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
