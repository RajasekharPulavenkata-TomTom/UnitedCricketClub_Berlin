<h3 class="page-header"><i class="bi bi-person-lines-fill me-2"></i>Player Inventory</h3>

<div class="card mb-3 no-print">
  <div class="card-body">
    <div class="row g-2 align-items-center">
      <div class="col">
        <input type="search" id="filter-player" class="form-control form-control-sm" placeholder="Filter by player name…" />
      </div>
      <div class="col-auto ms-auto">
        <span class="text-muted small" id="player-count"></span>
      </div>
    </div>
  </div>
</div>

<div id="player-grid" class="row g-3">
  <div class="col-12 text-center py-5">
    <div class="spinner-border text-success"></div>
  </div>
</div>

<!-- Player Detail Modal -->
<div class="modal fade" id="playerModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title d-flex align-items-center gap-2">
          <i class="bi bi-person-circle text-success"></i>
          <span id="modal-player-name"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Equipment</th>
                <th class="text-center">Qty</th>
                <th>Assigned</th>
                <th>Expected Return</th>
                <th>Returned</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="modal-tbody">
              <tr><td colspan="6" class="text-center py-4"><div class="spinner-border spinner-border-sm text-success"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer justify-content-start">
        <span class="text-muted small" id="modal-summary"></span>
      </div>
    </div>
  </div>
</div>
