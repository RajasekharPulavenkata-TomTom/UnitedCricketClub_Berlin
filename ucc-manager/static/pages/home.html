<style>
  .next-event-card {
    background: linear-gradient(135deg, #112270 0%, #1a3a8b 60%, #1e4db7 100%);
    border-radius: 14px; color: #fff; position: relative; overflow: hidden;
  }
  .next-event-card::before {
    content: ""; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='30'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .next-event-label {
    font-size: .65rem; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; opacity: .7;
  }
  .avail-pill {
    border-radius: 20px; padding: 4px 12px; font-size: .8rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .event-row { border-radius: 10px; padding: 12px 16px; transition: box-shadow .15s; cursor: pointer; }
  .event-row:hover { box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  .event-row-match    { border-left: 4px solid #0d6efd; background: #f0f5ff; }
  .event-row-training { border-left: 4px solid #198754; background: #f0faf4; }
  .event-row-other    { border-left: 4px solid #6c757d; background: #f8f9fa; }
  .stat-card { flex: 1; min-width: 130px; cursor: pointer; transition: box-shadow .15s; }
  .stat-card:hover .card { box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .result-badge-won  { background: #d1e7dd; color: #0a3622; }
  .result-badge-lost { background: #f8d7da; color: #58151c; }

</style>
