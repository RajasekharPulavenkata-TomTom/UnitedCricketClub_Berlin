<!-- Welcome banner -->
<div class="card mb-4 border-0" style="background:linear-gradient(135deg,#d4661a 0%,#f47920 100%);">
  <div class="card-body py-4 px-4 d-flex align-items-center justify-content-between gap-3 flex-wrap">
    <div class="d-flex align-items-center gap-3">
      <img src="/img/ucc-logo.png" alt="UCC" style="height:64px;width:64px;object-fit:contain;" />
      <div>
        <h2 class="text-white fw-bold mb-0">United Cricket Club</h2>
        <div class="text-white-50 small" id="home-date"></div>
      </div>
    </div>
    <a href="https://unitedcricketclub.de/" target="_blank" rel="noopener noreferrer"
       class="btn btn-light fw-semibold d-flex align-items-center gap-2">
      <i class="bi bi-globe"></i> Official Website
      <i class="bi bi-box-arrow-up-right" style="font-size:.8rem"></i>
    </a>
  </div>
</div>

<!-- Top stat cards -->
<div class="row g-3 mb-4">
  <div class="col-6 col-xl-3">
    <a href="#members" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-people"></i> Members
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-total-members">—</div>
        <div class="text-muted small" id="home-active-members"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#equipment" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-bag"></i> Equipment
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-total-equipment">—</div>
        <div class="text-muted small" id="home-available-equipment"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#dashboard" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-cash-coin"></i> Balance
        </div>
        <div class="fs-2 fw-bold" id="home-balance">—</div>
        <div class="text-muted small" id="home-balance-sub"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#player-inventory" class="text-decoration-none">
      <div class="card stat-card h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-person-check"></i> Items Assigned
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-assigned">—</div>
        <div class="text-muted small" id="home-assigned-sub"></div>
      </div>
    </a>
  </div>
  <div class="col-6 col-xl-3">
    <a href="#tasks" class="text-decoration-none">
      <div class="card stat-card stat-count h-100 p-3">
        <div class="d-flex align-items-center gap-2 text-muted small mb-1">
          <i class="bi bi-check2-square"></i> Open Tasks
        </div>
        <div class="fs-2 fw-bold text-dark" id="home-open-tasks">—</div>
        <div class="text-muted small" id="home-tasks-sub"></div>
      </div>
    </a>
  </div>
</div>

<!-- Upcoming Events -->
<div class="card mb-4">
  <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
    <span><i class="bi bi-calendar3 me-2"></i>Upcoming Events</span>
    <a href="#calendar" class="btn btn-sm btn-outline-success">Calendar</a>
  </div>
  <div class="card-body p-0" id="home-events">
    <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
  </div>
</div>

<div class="row g-3">
  <!-- Member breakdown -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold">
        <i class="bi bi-people me-2"></i>Members
      </div>
      <div class="card-body" id="home-member-breakdown">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>

  <!-- Equipment summary -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold">
        <i class="bi bi-bag me-2"></i>Equipment
      </div>
      <div class="card-body" id="home-equipment-breakdown">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>

  <!-- Recent transactions -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
        <span><i class="bi bi-clock-history me-2"></i>Recent Transactions</span>
        <a href="#transactions" class="btn btn-sm btn-outline-success">View All</a>
      </div>
      <div class="card-body p-0" id="home-recent-tx">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>

  <!-- Open tasks -->
  <div class="col-lg-3">
    <div class="card h-100">
      <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
        <span><i class="bi bi-check2-square me-2"></i>Open Tasks</span>
        <a href="#tasks" class="btn btn-sm btn-outline-success">View All</a>
      </div>
      <div class="card-body p-0" id="home-tasks-list">
        <div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>
      </div>
    </div>
  </div>
</div>
