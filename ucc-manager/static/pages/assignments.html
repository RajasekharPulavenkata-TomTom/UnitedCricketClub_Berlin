<h3 class="page-header"><i class="bi bi-person-check me-2"></i>Equipment Assignments</h3>

<div class="card mb-3 no-print">
  <div class="card-body">
    <div class="row g-2 align-items-center">
      <div class="col-auto">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="filter-active" checked />
          <label class="form-check-label fw-semibold" for="filter-active">Currently Out Only</label>
        </div>
      </div>
      <div class="col">
        <input type="search" id="filter-member" class="form-control form-control-sm" placeholder="Filter by member name…" />
      </div>
      <div class="col-auto ms-auto">
        <button class="btn btn-success btn-sm" id="btn-assign">
          <i class="bi bi-plus-lg me-1"></i>Assign Equipment
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>Member</th><th>Equipment</th><th class="text-center">Qty</th><th>Assigned</th><th>Expected Return</th><th>Returned</th><th class="no-print"></th></tr>
        </thead>
        <tbody id="assign-tbody">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Assign Modal -->
<div class="modal fade" id="assignModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Assign Equipment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="assign-form">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Equipment</label>
            <select class="form-select" name="equipment_id" id="eq-select" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Member Name</label>
            <input type="text" class="form-control" name="member_name" list="member-datalist" required />
            <datalist id="member-datalist"></datalist>
          </div>
          <div class="row g-3">
            <div class="col-4">
              <label class="form-label">Quantity</label>
              <input type="number" class="form-control" name="quantity_assigned" value="1" min="1" required />
            </div>
            <div class="col-4">
              <label class="form-label">Assigned Date</label>
              <input type="date" class="form-control" name="assigned_date" required />
            </div>
            <div class="col-4">
              <label class="form-label">Expected Return</label>
              <input type="date" class="form-control" name="expected_return_date" />
            </div>
          </div>
          <div class="mb-0 mt-3">
            <label class="form-label">Notes</label>
            <textarea class="form-control" name="notes" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Assign</button>
        </div>
      </form>
    </div>
  </div>
</div>
