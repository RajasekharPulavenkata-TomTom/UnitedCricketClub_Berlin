<h3 class="page-header"><i class="bi bi-people-fill me-2"></i>User Management</h3>

<div class="card mb-3 no-print">
  <div class="card-body py-2">
    <div class="d-flex align-items-center gap-2">
      <input type="search" id="um-search" class="form-control form-control-sm" placeholder="Search by username or name…" style="max-width:280px" />
      <select id="um-filter-status" class="form-select form-select-sm" style="max-width:150px">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="pending">Pending</option>
        <option value="rejected">Rejected</option>
      </select>
      <button class="btn btn-success btn-sm ms-auto" id="btn-add-user">
        <i class="bi bi-plus-lg me-1"></i>Add User
      </button>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Username</th>
            <th>Full Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Member</th>
            <th>Created</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="um-tbody">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="umAddModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:420px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="um-add-form">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" name="full_name" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" name="username" required autocomplete="off" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" name="password" required autocomplete="new-password" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select class="form-select" name="role" required>
              <option value="player">Player — read & interact</option>
              <option value="manager">Manager — manage & approve</option>
              <option value="developer">Developer — full access</option>
            </select>
          </div>
          <div id="um-add-error" class="alert alert-danger py-2 small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Create User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Edit Role Modal -->
<div class="modal fade" id="umEditModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:380px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil me-2"></i>Edit User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="um-edit-form">
        <input type="hidden" name="id" />
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" name="username" required autocomplete="off" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" name="full_name" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select class="form-select" name="role">
              <option value="player">Player — read & interact</option>
              <option value="manager">Manager — manage & approve</option>
              <option value="developer">Developer — full access</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Member Profile <span class="text-muted fw-normal small">(optional)</span></label>
            <select class="form-select" name="member_id" id="um-edit-member">
              <option value="">— Not linked —</option>
            </select>
            <div class="form-text text-muted small">Links this login to a player's member record (required for violations).</div>
          </div>
          <div id="um-edit-error" class="alert alert-danger py-2 small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="umPwdModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:360px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-key me-2"></i>Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="um-pwd-form">
        <input type="hidden" name="id" />
        <div class="modal-body">
          <p class="text-muted small mb-3">Setting a new password for <strong id="um-pwd-username"></strong>.</p>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input type="password" class="form-control" name="new_password" required autocomplete="new-password" />
          </div>
          <div id="um-pwd-error" class="alert alert-danger py-2 small d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Reset Password</button>
        </div>
      </form>
    </div>
  </div>
</div>
