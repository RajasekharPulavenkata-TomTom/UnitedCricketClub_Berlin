<h3 class="page-header"><i class="bi bi-bag me-2"></i>Equipment</h3>

<div class="card mb-3 no-print">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-auto">
        <select id="filter-type" class="form-select form-select-sm">
          <option value="">All Types</option>
          <option value="bat">Bat</option>
          <option value="ball">Ball</option>
          <option value="helmet">Helmet</option>
          <option value="pads">Pads</option>
          <option value="gloves">Gloves</option>
          <option value="stumps">Stumps</option>
          <option value="jersey">Jersey</option>
          <option value="bag">Bag</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="col-auto">
        <select id="filter-cond" class="form-select form-select-sm">
          <option value="">All Conditions</option>
          <option value="Good">Good</option>
          <option value="Fair">Fair</option>
          <option value="Poor">Poor</option>
        </select>
      </div>
      <div class="col-auto">
        <div class="form-check mb-0 pt-1">
          <input class="form-check-input" type="checkbox" id="filter-active" checked />
          <label class="form-check-label" for="filter-active">Active only</label>
        </div>
      </div>
      <div class="col">
        <input type="search" id="filter-search" class="form-control form-control-sm" placeholder="Search…" />
      </div>
      <div class="col-auto ms-auto">
        <button class="btn btn-success btn-sm" id="btn-add-eq">
          <i class="bi bi-plus-lg me-1"></i>Add Equipment
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th><th>Type</th><th>Condition</th>
            <th class="text-center">Total</th><th class="text-center">Available</th>
            <th>Notes</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="eq-tbody">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="eqModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eqModalTitle">Add Equipment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="eq-form">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" name="name" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Type</label>
              <select class="form-select" name="type" required>
                <option value="bat">Bat</option>
                <option value="ball">Ball</option>
                <option value="helmet">Helmet</option>
                <option value="pads">Pads</option>
                <option value="gloves">Gloves</option>
                <option value="stumps">Stumps</option>
                <option value="jersey">Jersey</option>
                <option value="bag">Bag</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Quantity</label>
              <input type="number" class="form-control" name="quantity_total" min="1" value="1" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Condition</label>
              <select class="form-select" name="condition">
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
                <option value="Poor">Poor</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Supplier</label>
              <input type="text" class="form-control" name="supplier" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Serial Number</label>
              <input type="text" class="form-control" name="serial_number" />
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Detail Panel -->
<div class="modal fade" id="eqDetailModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="eqDetailTitle">Equipment Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="eq-detail-body">Loading…</div>
    </div>
  </div>
</div>
