<h3 class="page-header"><i class="bi bi-people me-2"></i>User Management</h3>

<!-- Pending Registrations -->
<div id="pending-reg-section" class="d-none mb-4">
  <h5 class="text-warning"><i class="bi bi-person-exclamation me-1"></i>Pending Registrations <span id="pending-reg-count" class="badge bg-warning text-dark"></span></h5>
  <div class="card border-warning">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-warning">
            <tr><th>Username</th><th>Full Name</th><th>Requested</th><th></th></tr>
          </thead>
          <tbody id="pending-reg-tbody">
            <tr><td colspan="4" class="text-center py-3 text-muted">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-end mb-3">
  <button class="btn btn-success btn-sm" id="btn-add-user">
    <i class="bi bi-plus-lg me-1"></i>Add User
  </button>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>Username</th><th>Full Name</th><th>Role</th><th>Status</th><th>Created</th><th></th></tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add/Edit User Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalTitle">Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="user-form">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" required autocomplete="off" />
          </div>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" name="full_name" />
          </div>
          <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" name="role" required>
              <option value="player">Player — View &amp; submit requests</option>
              <option value="manager">Manager — Manage &amp; approve</option>
              <option value="developer">Developer — Full access</option>
            </select>
          </div>
          <div class="mb-3" id="password-field">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" autocomplete="new-password" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal fade" id="pwModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Reset Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="pw-form">
        <div class="modal-body">
          <input type="hidden" name="user_id" />
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" name="new_password" required autocomplete="new-password" />
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-warning">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
