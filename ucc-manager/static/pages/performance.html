<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 page-header">
  <h3 class="mb-0" style="border:none"><i class="bi bi-speedometer me-2"></i>Performance Metrics</h3>
  <div class="btn-group btn-group-sm" role="group" aria-label="Time window" id="perf-window">
    <button class="btn btn-outline-primary" data-days="7">7 days</button>
    <button class="btn btn-outline-primary active" data-days="30">30 days</button>
    <button class="btn btn-outline-primary" data-days="90">90 days</button>
  </div>
</div>

<div id="perf-summary" class="row g-3 mb-4"></div>

<div class="card mb-4" id="perf-daily-card" style="display:none">
  <div class="card-header bg-white fw-semibold">Daily Average Load Time <span class="text-muted fw-normal small perf-window-label"></span></div>
  <div class="card-body pt-3 pb-2">
    <div id="perf-daily" class="perf-daily"></div>
  </div>
</div>

<div class="card mb-4" id="perf-trend-card" style="display:none">
  <div class="card-body py-3">
    <div class="d-flex align-items-center gap-4 flex-wrap" id="perf-trend"></div>
  </div>
</div>

<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between flex-wrap gap-2">
    <span class="fw-semibold">Page Load Times <span class="text-muted fw-normal small perf-window-label"></span></span>
    <div class="d-flex gap-2 align-items-center flex-wrap">
      <span class="badge bg-light text-dark border"><i class="bi bi-phone me-1"></i>Mobile &lt; 768 px</span>
      <span class="badge bg-light text-dark border"><i class="bi bi-display me-1"></i>Desktop ≥ 768 px</span>
    </div>
  </div>
  <div id="perf-table-wrap">
    <div class="d-flex justify-content-center py-5"><div class="spinner-border text-success"></div></div>
  </div>
</div>

<style>
.perf-daily { display:flex; align-items:flex-end; gap:2px; height:110px; }
.perf-daily .pd-col { flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%; min-width:0; }
.perf-daily .pd-bar { border-radius:3px 3px 0 0; min-height:2px; }
.perf-daily .pd-label { font-size:.62rem; color:#6c757d; text-align:center; margin-top:2px; white-space:nowrap; overflow:visible; height:14px; }
.perf-bar-bg { height:6px; background:#e9ecef; border-radius:3px; overflow:hidden; margin-top:4px; }
.perf-bar    { height:6px; border-radius:3px; transition:width .4s ease; }
.perf-ms-good   { color:#198754; }
.perf-ms-ok     { color:#fd7e14; }
.perf-ms-slow   { color:#dc3545; }
</style>
