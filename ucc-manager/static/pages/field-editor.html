<!-- Field Editor -->
<style>
  #fe-svg { touch-action: none; user-select: none; cursor: crosshair; }
  .fe-fielder { cursor: grab; }
  .fe-fielder:active { cursor: grabbing; }
  .fe-player-item { cursor: pointer; border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; display: flex; align-items: center; justify-content: space-between; font-size: 0.8rem; transition: background 0.15s; }
  .fe-player-item:hover { filter: brightness(0.93); }
  .fe-player-item.placed { background: #d1e7dd; border: 1px solid #0f5132; }
  .fe-player-item.unplaced { background: #f8f9fa; border: 1px solid #dee2e6; }
  .fe-formation-item { padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
  .fe-formation-item:last-child { border-bottom: none; }
  .fe-formation-item:hover { background: #f8f9fa; }
  .fe-formation-item.active-formation { background: #cfe2ff; }
  @media print {
    body > *, .no-print { display: none !important; }
    #fe-print-area { display: block !important; text-align: center; }
  }
</style>

<div class="d-flex flex-column gap-3" id="fe-print-area" style="display:none">
  <!-- top controls -->
  <div class="d-flex align-items-start justify-content-between flex-wrap gap-2 no-print">
    <h4 class="mb-0"><i class="bi bi-diagram-3 me-2"></i>Field Editor</h4>
    <div class="d-flex gap-2 flex-wrap align-items-center">
      <input id="fe-name" type="text" class="form-control form-control-sm" style="width:180px" placeholder="Formation name…">
      <select id="fe-event" class="form-select form-select-sm" style="width:190px">
        <option value="">— No match linked —</option>
      </select>
      <button id="btn-fe-new" class="btn btn-sm btn-outline-secondary" title="New / Clear field">
        <i class="bi bi-file-earmark me-1"></i>New
      </button>
      <button id="btn-fe-save" class="btn btn-sm btn-success">
        <i class="bi bi-floppy me-1"></i>Save
      </button>
      <button id="btn-fe-export" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-download me-1"></i>PNG
      </button>
      <button id="btn-fe-print" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-printer me-1"></i>Print
      </button>
    </div>
  </div>

  <!-- body -->
  <div class="row g-3">
    <!-- sidebar -->
    <div class="col-lg-3 no-print">
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center py-2">
          <span class="fw-semibold small"><i class="bi bi-people me-1"></i>Players</span>
          <span id="fe-count-badge" class="badge bg-secondary">0</span>
        </div>
        <div class="card-body p-2">
          <input id="fe-player-search" type="text" class="form-control form-control-sm mb-2" placeholder="Search…">
          <div id="fe-player-list" style="max-height:320px;overflow-y:auto"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header py-2 d-flex justify-content-between align-items-center">
          <span class="fw-semibold small"><i class="bi bi-collection me-1"></i>Saved Formations</span>
          <span id="fe-formations-count" class="badge bg-secondary">0</span>
        </div>
        <div id="fe-formations-list" style="max-height:320px;overflow-y:auto">
          <div class="text-center text-muted small py-3">No formations yet</div>
        </div>
      </div>
    </div>

    <!-- field -->
    <div class="col-lg-9">
      <div class="text-center" id="fe-field-wrap">
        <svg id="fe-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:620px">
          <defs>
            <radialGradient id="fe-grad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#4a9e5c"/>
              <stop offset="80%" stop-color="#2e7d42"/>
              <stop offset="100%" stop-color="#1e5c2e"/>
            </radialGradient>
          </defs>
          <!-- dark surround -->
          <rect width="600" height="600" fill="#1a3d22"/>
          <!-- outfield oval -->
          <ellipse cx="300" cy="300" rx="278" ry="268" fill="url(#fe-grad)" stroke="white" stroke-width="3"/>
          <!-- 30-yard circle -->
          <ellipse cx="300" cy="300" rx="140" ry="134" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.5" stroke-dasharray="8,5"/>
          <!-- pitch strip -->
          <rect x="284" y="192" width="32" height="216" rx="3" fill="#c8b060" stroke="#a0883a" stroke-width="1.5"/>
          <!-- bowling crease -->
          <line x1="276" y1="225" x2="324" y2="225" stroke="white" stroke-width="2"/>
          <line x1="276" y1="375" x2="324" y2="375" stroke="white" stroke-width="2"/>
          <!-- popping crease -->
          <line x1="270" y1="234" x2="330" y2="234" stroke="white" stroke-width="1.5"/>
          <line x1="270" y1="366" x2="330" y2="366" stroke="white" stroke-width="1.5"/>
          <!-- stumps (top end) -->
          <line x1="295" y1="222" x2="295" y2="236" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="300" y1="222" x2="300" y2="236" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="305" y1="222" x2="305" y2="236" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
          <!-- stumps (bottom end) -->
          <line x1="295" y1="364" x2="295" y2="378" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="300" y1="364" x2="300" y2="378" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="305" y1="364" x2="305" y2="378" stroke="#8B5E3C" stroke-width="2.5" stroke-linecap="round"/>
          <!-- end labels -->
          <text x="300" y="178" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">▲ Bowling End</text>
          <text x="300" y="430" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)" font-family="sans-serif">▼ Batting End</text>
          <!-- players rendered here -->
          <g id="fe-players-group"></g>
        </svg>
        <p class="text-muted small mt-2 mb-0 no-print">
          <i class="bi bi-info-circle me-1"></i>Click a player in the list to add · Drag to reposition · Click again in list to remove
        </p>
      </div>
    </div>
  </div>
</div>

<!-- Save modal -->
<div class="modal fade" id="feSaveModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered" style="max-width:380px">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-floppy me-2"></i>Save Formation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Formation Name <span class="text-danger">*</span></label>
          <input id="fe-save-name" class="form-control" placeholder="e.g. Defensive vs. Pace, Match vs. Wanderers…">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Link to Match (optional)</label>
          <select id="fe-save-event" class="form-select">
            <option value="">— No match —</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Notes</label>
          <textarea id="fe-save-notes" class="form-control" rows="2" placeholder="Tactical notes…"></textarea>
        </div>
        <div id="fe-save-error" class="alert alert-danger py-2 small d-none"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button id="btn-fe-save-confirm" class="btn btn-success">Save Formation</button>
      </div>
    </div>
  </div>
</div>
