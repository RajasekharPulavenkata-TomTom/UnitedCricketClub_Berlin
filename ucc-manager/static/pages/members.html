<h3 class="page-header"><i class="bi bi-people me-2"></i>Members</h3>

<div class="card mb-3 no-print">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col">
        <input type="search" id="filter-search" class="form-control form-control-sm" placeholder="Search by name…" />
      </div>
      <div class="col-auto">
        <select id="filter-ball-type" class="form-select form-select-sm">
          <option value="">All Types</option>
          <option value="Tennis">Tennis</option>
          <option value="Leather">Leather</option>
          <option value="Both">Both</option>
        </select>
      </div>
      <div class="col-auto">
        <div class="form-check mb-0 pt-1">
          <input class="form-check-input" type="checkbox" id="filter-active" />
          <label class="form-check-label" for="filter-active">Active only</label>
        </div>
      </div>
      <div class="col-auto ms-auto">
        <button class="btn btn-success btn-sm" id="btn-add-member">
          <i class="bi bi-plus-lg me-1"></i>Add Member
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Jersey</th>
            <th>Role</th>
            <th>Ball Type</th>
            <th>DCB ID</th>
            <th class="text-center">CricHeroes</th>
            <th class="text-center">CricClubs</th>
            <th>Status</th>
            <th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="members-tbody">
          <tr><td colspan="10" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="memberModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="memberModalTitle">Add Member</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="member-form">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="name" required />
            </div>
            <div class="col-md-4">
              <label class="form-label">Role</label>
              <select class="form-select" name="role">
                <option value="">— select —</option>
                <option value="Bat">Bat</option>
                <option value="Ball">Ball</option>
                <option value="All Rounder">All Rounder</option>
                <option value="Bat/WK">Bat/WK</option>
                <option value="Bowler">Bowler</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Ball Type</label>
              <select class="form-select" name="ball_type">
                <option value="">— select —</option>
                <option value="Tennis">Tennis only</option>
                <option value="Leather">Leather only</option>
                <option value="Both">Both</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">DCB ID</label>
              <input type="text" class="form-control" name="dcb_id" placeholder="e.g. DCB0M44632" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" name="email" placeholder="player@example.com" />
            </div>
            <div class="col-md-4 d-flex align-items-end gap-3 pb-1">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="cricheroes" id="chk-cricheroes" />
                <label class="form-check-label" for="chk-cricheroes">CricHeroes</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="cricclubs" id="chk-cricclubs" />
                <label class="form-check-label" for="chk-cricclubs">CricClubs</label>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Name on Jersey</label>
              <input type="text" class="form-control" name="jersey_name" placeholder="Short display name" />
            </div>
            <div class="col-md-2">
              <label class="form-label">Jersey No.</label>
              <input type="number" class="form-control" name="jersey_number" min="1" />
            </div>
            <div class="col-12">
              <label class="form-label">Notes</label>
              <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
