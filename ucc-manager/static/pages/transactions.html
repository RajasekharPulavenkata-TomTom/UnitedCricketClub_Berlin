<h3 class="page-header"><i class="bi bi-list-ul me-2"></i>Transactions</h3>

<div class="card mb-3 no-print">
  <div class="card-body">
    <div class="row g-2 align-items-end">
      <div class="col-auto">
        <select id="filter-type" class="form-select form-select-sm">
          <option value="">All Types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </div>
      <div class="col-auto">
        <select id="filter-cat" class="form-select form-select-sm"><option value="">All Categories</option></select>
      </div>
      <div class="col-auto">
        <input type="month" id="filter-month" class="form-control form-control-sm" />
      </div>
      <div class="col">
        <input type="search" id="filter-search" class="form-control form-control-sm" placeholder="Search description / ref…" />
      </div>
      <div class="col-auto ms-auto">
        <button class="btn btn-success btn-sm" id="btn-add-tx">
          <i class="bi bi-plus-lg me-1"></i>Add Transaction
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Date</th><th>Type</th><th>Category</th>
            <th>Description</th><th>Reference</th>
            <th class="text-end">Amount</th><th class="no-print"></th>
          </tr>
        </thead>
        <tbody id="tx-tbody">
          <tr><td colspan="7" class="text-center py-4 text-muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="txModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="txModalTitle">Add Transaction</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="tx-form">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Type</label>
            <select class="form-select" name="type" id="form-type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" name="category_id" id="form-cat">
              <option value="">— None —</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount (€)</label>
            <input type="number" class="form-control" name="amount" step="0.01" min="0.01" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" name="description" />
          </div>
          <div class="mb-3">
            <label class="form-label">Reference</label>
            <input type="text" class="form-control" name="reference" placeholder="Cheque #, bank ref…" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
