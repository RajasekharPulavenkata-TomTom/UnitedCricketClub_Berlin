name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ucc-manager

jobs:
  # ── Job 1: API / unit tests ───────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucc
          POSTGRES_PASSWORD: ucc_test
          POSTGRES_DB: ucc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://ucc:ucc_test@localhost:5432/ucc_test
      DATABASE_URL: postgresql://ucc:ucc_test@localhost:5432/ucc_test
      UCC_SECRET_KEY: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ucc-manager/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run API tests
        run: pytest tests/api/ -v --tb=short

  # ── Job 2: E2E / Playwright tests ────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ucc
          POSTGRES_PASSWORD: ucc_test
          POSTGRES_DB: ucc_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ucc:ucc_test@localhost:5432/ucc_e2e
      UCC_SECRET_KEY: ci-test-secret
      E2E_BASE_URL: http://localhost:8000
      E2E_USERNAME: ci_admin
      E2E_PASSWORD: ci_e2e_pass_123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ucc-manager/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          playwright install chromium --with-deps

      - name: Initialise database schema
        run: python -c "import models; from database import engine, Base; Base.metadata.create_all(bind=engine)"

      - name: Seed CI admin user
        run: python tests/seed_ci_user.py

      - name: Start server
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          # Wait until the server is accepting connections
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 1
          done

      - name: Run E2E tests
        run: pytest tests/e2e/ -v --tb=short
